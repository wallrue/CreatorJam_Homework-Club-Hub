<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Homework Club Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lexend:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1 { font-family: 'Lexend', sans-serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen">
    <nav class="p-6 flex justify-between items-center max-w-7xl mx-auto">
        <div class="text-2xl font-bold text-emerald-800 flex items-center gap-2">
            <span class="text-3xl">📚</span> Homework Club Hub
        </div>
        <div class="space-x-6 hidden md:flex items-center">
            <a href="/" class="text-stone-600 hover:text-emerald-700 transition">Home</a>
            <a href="/logout" class="text-red-600 hover:text-red-800 transition">Logout</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto py-12 px-6">
        <div class="bg-white rounded-3xl shadow-sm border border-stone-200 overflow-hidden">
            <div class="bg-emerald-700 h-32"></div>
            <div class="px-8 pb-8">
                <div class="relative -mt-12 mb-6">
                    <div class="w-24 h-24 bg-stone-200 rounded-full border-4 border-white shadow-md flex items-center justify-center text-3xl">👤</div>
                </div>
                
                <h1 id="userName" class="text-3xl font-bold text-stone-800 mb-1">Loading...</h1>
                <p id="userRole" class="text-emerald-700 font-medium mb-6">Please wait...</p>
                
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="p-4 bg-stone-50 rounded-2xl border border-stone-100">
                        <p class="text-xs text-stone-500 uppercase font-bold mb-1">Email Address</p>
                        <p id="userEmail" class="text-stone-800 font-medium">—</p>
                    </div>
                    <div class="p-4 bg-stone-50 rounded-2xl border border-stone-100">
                        <p class="text-xs text-stone-500 uppercase font-bold mb-1">Member Since</p>
                        <p id="userJoined" class="text-stone-800 font-medium">—</p>
                    </div>
                </div>
                
                <div class="mt-8 pt-8 border-t border-stone-100">
                    <h3 class="text-xl font-bold mb-4">Account Settings</h3>
                    <button class="px-6 py-2 bg-stone-800 text-white rounded-lg font-semibold hover:bg-stone-900 transition">Edit Profile</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function loadProfile() {
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name');
            const endpoint = name ? `/api/profile?name=${encodeURIComponent(name)}` : '/api/me';

            try {
                const response = await fetch(endpoint);
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('userName').textContent = user.full_name;
                    document.getElementById('userRole').textContent = user.role.replace('_', ' ').toUpperCase();
                    document.getElementById('userEmail').textContent = user.email;
                    document.getElementById('userJoined').textContent = user.created_at;
                } else {
                    if (!name) {
                        window.location.href = '/login';
                    } else {
                        document.getElementById('userName').textContent = "User Not Found";
                    }
                }
            } catch (err) {
                console.error('Error loading profile:', err);
            }
        }
        loadProfile();
    </script>
</body>
</html>
