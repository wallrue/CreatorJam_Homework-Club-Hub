
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Homework Club Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <div class="nav-brand"><strong>📚 Homework Club Hub</strong></div>
        <div class="nav-links">
            <a href="/">Home</a>
        </div>
    </nav>

    <div class="auth-container">
        <h2 style="text-align: center; color: var(--primary-color);">Welcome Back</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="jane@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem;">Login</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem;">New here? <a href="/join">Join the community</a></p>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            if (response.ok) {
                window.location.href = '/profile';
            } else {
                alert('Error: ' + result.error);
            }
        };
    </script>
</body>
</html>
