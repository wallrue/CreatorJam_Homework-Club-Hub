
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Homework Club Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <div class="nav-brand"><strong>📚 Homework Club Hub</strong></div>
        <div class="nav-links">
            <a href="/">Home</a>
        </div>
    </nav>

    <div class="auth-container">
        <h2 style="text-align: center; color: var(--primary-color);">Create Account</h2>
        <form id="joinForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="full_name" required placeholder="Jane Doe">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="jane@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label>I am a...</label>
                <select id="role">
                    <option value="student_parent">Student / Parent</option>
                    <option value="volunteer">Volunteer Tutor</option>
                </select>
            </div>
            <div class="form-group">
                <label>Subject Interest / Expertise</label>
                <input type="text" id="subject" placeholder="e.g. Chemistry, Algebra, Biology">
            </div>
            <div class="form-group">
                <label>Language / Cultural Background</label>
                <input type="text" id="language" placeholder="e.g. Spanish, Vietnamese, English">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem;">Join the Club</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem;">Already have an account? <a href="/login">Login here</a></p>
    </div>

    <script>
        document.getElementById('joinForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                full_name: document.getElementById('full_name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value,
                subject: document.getElementById('subject').value,
                language: document.getElementById('language').value
            };

            const response = await fetch('/api/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            if (response.ok) {
                alert('Welcome to the club!');
                window.location.href = '/login';
            } else {
                alert('Error: ' + result.error);
            }
        };
    </script>
</body>
</html>
