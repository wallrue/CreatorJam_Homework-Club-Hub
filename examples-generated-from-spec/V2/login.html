<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Homework Club Hub</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #e67e22;
            --light: #f4f7f6;
            --text: #333;
            --white: #ffffff;
            --error: #e74c3c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light);
            color: var(--text);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: var(--primary);
            color: var(--white);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
            color: var(--white);
        }
        .login-container {
            max-width: 400px;
            margin: auto;
            background: var(--white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
        }
        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary);
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background-color: var(--secondary);
            color: var(--white);
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #2980b9;
        }
        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }
        .msg-success { background: #d4edda; color: #155724; display: block !important; }
        .msg-error { background: #f8d7da; color: #721c24; display: block !important; }
        .footer-link {
            text-align: center;
            margin-top: 20px;
        }
        .footer-link a {
            color: var(--secondary);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">📚 Homework Club Hub</a>
        <nav>
            <a href="/" style="color: white; text-decoration: none;">Home</a>
        </nav>
    </header>

    <div class="login-container">
        <h2>Welcome Back</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn-submit">Login</button>
        </form>
        <div id="message"></div>
        <div class="footer-link">
            Don't have an account? <a href="/join">Join the club</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            msgDiv.className = '';
            msgDiv.innerText = 'Logging in...';
            msgDiv.style.display = 'block';

            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (response.ok) {
                    msgDiv.className = 'msg-success';
                    msgDiv.innerText = result.message;
                    setTimeout(() => window.location.href = '/search', 1000);
                } else {
                    msgDiv.className = 'msg-error';
                    msgDiv.innerText = result.error || 'Invalid email or password';
                }
            } catch (err) {
                msgDiv.className = 'msg-error';
                msgDiv.innerText = 'Network error. Please try again.';
            }
        });
    </script>
</body>
</html>
