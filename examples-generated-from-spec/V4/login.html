<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Homework Club Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4 { font-family: 'Lexend', sans-serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold text-emerald-700 flex items-center gap-2">
                        <i class="fas fa-graduation-cap"></i>
                        <span>Homework Club Hub</span>
                    </a>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/join" class="text-stone-600 hover:text-emerald-700 font-medium transition">Need an account? Join here</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-20 right-4 z-50 space-y-2"></div>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-stone-100">
            <div class="bg-emerald-700 py-8 px-6 text-center text-white">
                <h1 class="text-2xl font-bold mb-2">Welcome Back</h1>
                <p class="text-emerald-100">Login to access your academic community</p>
            </div>

            <div class="p-8">
                <form id="loginForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-stone-700 mb-1">Email Address</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-stone-400">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <input type="email" id="email" name="email" required
                                class="block w-full pl-10 pr-3 py-2 border border-stone-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 text-sm"
                                placeholder="name@example.com">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-stone-700 mb-1">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-stone-400">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" id="password" name="password" required
                                class="block w-full pl-10 pr-3 py-2 border border-stone-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 text-sm"
                                placeholder="password">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-emerald-700 text-white py-3 rounded-lg font-bold hover:bg-emerald-800 transition shadow-lg flex items-center justify-center gap-2">
                        Sign In <i class="fas fa-sign-in-alt text-sm"></i>
                    </button>
                </form>

                <div id="message" class="mt-4 text-center text-sm hidden"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-stone-500 text-xs border-t border-stone-200">
        &copy; 2026 Homework Club Hub. All rights reserved.
    </footer>

    <script>
        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-6 py-3 rounded-lg shadow-lg text-white font-medium ${type === 'success' ? 'bg-emerald-700' : 'bg-red-600'}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            msgDiv.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.ok) {
                    msgDiv.textContent = result.message;
                    msgDiv.className = 'mt-4 text-center text-sm text-emerald-700 font-medium';
                    msgDiv.classList.remove('hidden');
                    showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => window.location.href = '/search', 1500);
                } else {
                    msgDiv.textContent = result.error || 'Invalid credentials';
                    msgDiv.className = 'mt-4 text-center text-sm text-red-600 font-medium';
                    msgDiv.classList.remove('hidden');
                }
            } catch (error) {
                msgDiv.textContent = 'Network error. Please try again.';
                msgDiv.className = 'mt-4 text-center text-sm text-red-600 font-medium';
                msgDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
