<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sessions | Homework Club Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { outfit: ['Outfit', 'sans-serif'], source: ['Source Sans 3', 'sans-serif'] },
                    colors: { indigo: { 50:'#EEF2FF',100:'#E0E7FF',200:'#C7D2FE',300:'#A5B4FC',400:'#818CF8',500:'#6366F1',600:'#4F46E5',700:'#4338CA',800:'#3730A3',900:'#312E81' }, violet: { 50:'#F5F3FF',100:'#EDE9FE',200:'#DDD6FE',300:'#C4B5FD',400:'#A78BFA',500:'#8B5CF6',600:'#7C3AED',650:'#6B21A8',700:'#6D28D9',800:'#5B21B6',900:'#4C1D95' } }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Source Sans 3', sans-serif; }
        h1,h2,h3,h4,h5,h6 { font-family: 'Outfit', sans-serif; }
        .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border: 1px solid rgba(99,102,241,0.1); box-shadow: 0 4px 16px rgba(99,102,241,0.06); }
        .btn-primary { @apply bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-full font-semibold shadow-lg shadow-indigo-200 hover:shadow-xl transition-all; }
        .modal-overlay { background: rgba(15,23,42,0.5); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-gradient-to-b from-slate-50 via-indigo-50/20 to-white min-h-screen flex flex-col">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-indigo-100/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="/" class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-200">
                        <i class="fas fa-graduation-cap text-white text-sm"></i>
                    </div>
                    <span class="font-outfit font-bold text-xl text-indigo-900 tracking-tight">Homework Club Hub</span>
                </a>
                <div class="hidden md:flex items-center gap-1" id="nav-links"></div>
                <button id="mobile-menu-btn" class="md:hidden w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center text-slate-600 hover:text-indigo-600 transition">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-white/95 backdrop-blur-xl border-t border-indigo-100/50 px-4 py-4 space-y-2">
            <a href="/" class="block px-4 py-2.5 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 font-medium transition">Home</a>
            <a href="/search" class="block px-4 py-2.5 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 font-medium transition">Find a Tutor</a>
            <a href="/my-sessions" class="block px-4 py-2.5 rounded-xl bg-indigo-50 text-indigo-700 font-medium transition">My Sessions</a>
            <a href="/logout" class="block px-4 py-2.5 rounded-xl text-red-500 hover:bg-red-50 font-medium transition">Logout</a>
        </div>
    </nav>

    <div id="toast-container" class="fixed top-20 right-4 z-50 space-y-2"></div>

    <main class="flex-grow max-w-4xl mx-auto py-10 px-4">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-outfit font-bold text-slate-900 mb-1">My Sessions</h1>
                <p class="text-slate-500 text-lg">View and manage your tutoring sessions.</p>
            </div>
            <a href="/search" class="px-5 py-2.5 btn-primary text-sm flex items-center gap-2 shrink-0">
                <i class="fas fa-plus"></i> Find a Tutor
            </a>
        </div>

        <div id="sessions-list" class="space-y-4">
            <div class="glass rounded-2xl p-12 text-center">
                <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-indigo-50 flex items-center justify-center">
                    <i class="fas fa-spinner fa-spin text-indigo-500 text-2xl"></i>
                </div>
                <p class="font-medium text-slate-500">Loading sessions...</p>
            </div>
        </div>
    </main>

    <!-- Rating Modal -->
    <div id="rating-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
        <div class="glass rounded-3xl max-w-md w-full p-8 relative">
            <button id="close-rating-btn" class="absolute top-4 right-4 w-8 h-8 rounded-xl bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-600 transition">
                <i class="fas fa-times"></i>
            </button>
            <h3 class="text-xl font-outfit font-bold mb-2 text-slate-800">Rate This Session</h3>
            <p class="text-slate-500 text-sm mb-6">How was your experience with this tutor?</p>

            <form id="ratingForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-3">Your Rating</label>
                    <div class="flex gap-2 justify-center" id="star-rating">
                        <button type="button" class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl text-slate-200 hover:text-amber-400 hover:bg-amber-50 transition" data-star="1">&#9733;</button>
                        <button type="button" class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl text-slate-200 hover:text-amber-400 hover:bg-amber-50 transition" data-star="2">&#9733;</button>
                        <button type="button" class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl text-slate-200 hover:text-amber-400 hover:bg-amber-50 transition" data-star="3">&#9733;</button>
                        <button type="button" class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl text-slate-200 hover:text-amber-400 hover:bg-amber-50 transition" data-star="4">&#9733;</button>
                        <button type="button" class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl text-slate-200 hover:text-amber-400 hover:bg-amber-50 transition" data-star="5">&#9733;</button>
                    </div>
                    <input type="hidden" id="rating-value" value="0">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Feedback / Thank You Note</label>
                    <textarea id="rating-feedback" rows="3"
                        class="block w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all resize-none"
                        placeholder="Share your experience or say thank you..."></textarea>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" class="flex-1 py-3 btn-primary text-sm flex items-center justify-center gap-2">
                        <i class="fas fa-check"></i> Submit Rating
                    </button>
                    <button type="button" id="close-modal-btn" class="flex-1 py-3 bg-slate-100 text-slate-600 rounded-full font-semibold hover:bg-slate-200 transition text-sm">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-slate-50 border-t border-slate-200 py-12 px-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-600 to-violet-600 flex items-center justify-center">
                    <i class="fas fa-graduation-cap text-white text-xs"></i>
                </div>
                <span class="font-outfit font-bold text-lg text-indigo-900">Homework Club Hub</span>
            </div>
            <p class="text-slate-400 text-sm">&copy; 2026 Homework Club Hub. Powered by Indigenomics.</p>
            <div class="flex gap-5">
                <a href="#" class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-400 hover:bg-indigo-100 hover:text-indigo-600 transition"><i class="fab fa-linkedin"></i></a>
                <a href="#" class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-400 hover:bg-indigo-100 hover:text-indigo-600 transition"><i class="fab fa-twitter"></i></a>
                <a href="#" class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-400 hover:bg-indigo-100 hover:text-indigo-600 transition"><i class="fab fa-facebook"></i></a>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `px-6 py-3 rounded-xl shadow-lg text-white font-medium ${type === 'success' ? 'bg-emerald-700' : 'bg-red-600'}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        async function checkAuth() {
            try {
                const response = await fetch('/api/me');
                if (!response.ok) { window.location.href = '/login'; return false; }
                return true;
            } catch (err) { window.location.href = '/login'; return false; }
        }

        async function updateNav() {
            const navLinks = document.getElementById('nav-links');
            if (!navLinks) return;
            try {
                const response = await fetch('/api/me');
                if (response.ok) {
                    const user = await response.json();
                    let links = '';
                    links += '<a href="/" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 font-medium transition">Home</a>';
                    links += '<a href="/search" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 font-medium transition">Find a Tutor</a>';
                    links += '<a href="/my-profile" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 font-medium transition">My Profile</a>';
                    if (user.role === 'admin') {
                        links += '<a href="/admin" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 font-medium transition">Admin</a>';
                    }
                    links += '<a href="/logout" class="px-4 py-2 rounded-xl text-red-500 hover:bg-red-50 font-medium transition"><i class="fas fa-sign-out-alt mr-1"></i> Logout</a>';
                    navLinks.innerHTML = links;
                }
            } catch (err) {}
        }

        // Star rating
        let currentRatingId = null;
        let selectedRating = 0;

        document.querySelectorAll('#star-rating button').forEach(btn => {
            btn.addEventListener('click', () => {
                selectedRating = parseInt(btn.dataset.star);
                document.getElementById('rating-value').value = selectedRating;
                document.querySelectorAll('#star-rating button').forEach(b => {
                    b.classList.toggle('text-amber-400', parseInt(b.dataset.star) <= selectedRating);
                    b.classList.toggle('text-slate-200', parseInt(b.dataset.star) > selectedRating);
                });
            });
        });

        document.getElementById('close-rating-btn').addEventListener('click', () => {
            document.getElementById('rating-modal').classList.add('hidden');
        });
        document.getElementById('close-modal-btn').addEventListener('click', () => {
            document.getElementById('rating-modal').classList.add('hidden');
        });

        // Submit rating
        document.getElementById('ratingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const rating = parseInt(document.getElementById('rating-value').value);
            const feedback = document.getElementById('rating-feedback').value;

            if (rating === 0) {
                showToast('Please select a rating', 'error');
                return;
            }

            try {
                const response = await fetch(`/api/sessions/${currentRatingId}/rate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rating, feedback })
                });

                if (response.ok) {
                    showToast('Rating submitted! Thank you!', 'success');
                    document.getElementById('rating-modal').classList.add('hidden');
                    loadSessions();
                } else {
                    const result = await response.json();
                    showToast(result.error || 'Failed to submit rating', 'error');
                }
            } catch (err) {
                showToast('Network error. Please try again.', 'error');
            }
        });

        // Load sessions
        async function loadSessions() {
            const container = document.getElementById('sessions-list');
            container.innerHTML = '<div class="glass rounded-2xl p-12 text-center"><div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-indigo-50 flex items-center justify-center"><i class="fas fa-spinner fa-spin text-indigo-500 text-2xl"></i></div><p class="font-medium text-slate-500">Loading sessions...</p></div>';

            try {
                const response = await fetch('/api/sessions');
                const sessions = await response.json();

                if (sessions.error) {
                    container.innerHTML = `<div class="glass rounded-2xl p-12 text-center"><div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-slate-50 flex items-center justify-center"><i class="fas fa-info-circle text-slate-300 text-3xl"></i></div><p class="text-slate-500">${sessions.error}</p></div>`;
                    return;
                }

                if (sessions.length === 0) {
                    container.innerHTML = `<div class="glass rounded-3xl p-12 text-center">
                        <div class="w-20 h-20 mx-auto mb-6 rounded-3xl bg-gradient-to-br from-indigo-50 to-violet-50 flex items-center justify-center"><i class="fas fa-calendar-xmark text-indigo-300 text-4xl"></i></div>
                        <h3 class="text-xl font-outfit font-bold text-slate-500 mb-2">No Sessions Yet</h3>
                        <p class="text-slate-400 mb-6 max-w-md mx-auto">You haven't booked any tutoring sessions. Find a tutor who matches your needs and get started!</p>
                        <a href="/search" class="inline-flex items-center gap-2 px-6 py-3 btn-primary text-sm">
                            <i class="fas fa-search"></i> Find a Tutor
                        </a>
                    </div>`;
                    return;
                }

                container.innerHTML = sessions.map(s => {
                    const statusConfig = {
                        completed: { bg: 'bg-emerald-100', text: 'text-emerald-700', label: 'Completed' },
                        pending: { bg: 'bg-amber-100', text: 'text-amber-700', label: 'Pending' },
                        cancelled: { bg: 'red-100', text: 'text-red-700', label: 'Cancelled' },
                        confirmed: { bg: 'bg-indigo-100', text: 'text-indigo-700', label: 'Confirmed' }
                    };
                    const st = statusConfig[s.status] || statusConfig.pending;

                    return `<div class="glass rounded-2xl p-6 hover:shadow-lg transition-shadow">
                        <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
                            <div class="flex-1 min-w-0">
                                <div class="flex flex-wrap items-center gap-3 mb-3">
                                    <h3 class="font-outfit font-bold text-slate-800 text-lg">With ${s.tutor_name || 'Unknown'}</h3>
                                    <span class="px-3 py-1 rounded-full text-xs font-bold uppercase ${st.bg} ${st.text}">${st.label}</span>
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-slate-500">
                                    <p><i class="fas fa-user w-5 text-center text-slate-400"></i> Student: <span class="text-slate-700">${s.student_name || '—'}</span></p>
                                    <p><i class="fas fa-calendar w-5 text-center text-slate-400"></i> ${s.scheduled_time || s.preferred_date || '—'}</p>
                                    <p><i class="fas fa-book w-5 text-center text-slate-400"></i> Needs: <span class="text-slate-700">${s.needs || 'Not specified'}</span></p>
                                    <p><i class="fas ${s.session_type === 'in-person' ? 'fa-handshake' : 'fa-video'} w-5 text-center text-slate-400"></i> <span class="text-slate-700">${s.session_type === 'in-person' ? 'In-Person' : 'Online'}</span></p>
                                </div>
                                ${s.rating ? `<div class="mt-3 flex items-center gap-1 text-amber-400">
                                    ${'<i class="fas fa-star"></i>'.repeat(s.rating)}${'<i class="far fa-star text-slate-200"></i>'.repeat(5 - s.rating)}
                                    ${s.feedback ? `<span class="ml-2 text-sm text-slate-500 italic">"${s.feedback}"</span>` : ''}
                                </div>` : ''}
                            </div>
                            <div class="flex gap-2 shrink-0">
                                ${!s.rating ? `<button onclick="openRating(${s.session_id})" class="px-4 py-2 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-full text-sm font-semibold hover:shadow-lg transition flex items-center gap-1.5"><i class="fas fa-star text-xs"></i> Rate</button>` : ''}
                                ${s.status === 'pending' ? `<button onclick="cancelSession(${s.session_id})" class="px-4 py-2 bg-red-500 text-white rounded-full text-sm font-semibold hover:bg-red-600 transition flex items-center gap-1.5"><i class="fas fa-ban text-xs"></i> Cancel</button>` : ''}
                            </div>
                        </div>
                    </div>`;
                }).join('');

            } catch (err) {
                container.innerHTML = '<div class="glass rounded-2xl p-12 text-center text-red-500"><div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-red-50 flex items-center justify-center"><i class="fas fa-exclamation-triangle text-2xl"></i></div><p class="font-medium">Error loading sessions.</p></div>';
            }
        }

        window.openRating = function(sessionId) {
            currentRatingId = sessionId;
            selectedRating = 0;
            document.getElementById('rating-value').value = '0';
            document.getElementById('rating-feedback').value = '';
            document.querySelectorAll('#star-rating button').forEach(b => {
                b.classList.remove('text-amber-400');
                b.classList.add('text-slate-200');
            });
            document.getElementById('rating-modal').classList.remove('hidden');
        };

        window.cancelSession = async function(sessionId) {
            if (!confirm('Are you sure you want to cancel this session?')) return;

            try {
                const response = await fetch(`/api/sessions/${sessionId}/cancel`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    showToast('Session cancelled', 'success');
                    loadSessions();
                } else {
                    const result = await response.json();
                    showToast(result.error || 'Failed to cancel', 'error');
                }
            } catch (err) {
                showToast('Network error. Please try again.', 'error');
            }
        };

        checkAuth().then(ok => { if (ok) { loadSessions(); updateNav(); } });
    </script>
</body>
</html>
