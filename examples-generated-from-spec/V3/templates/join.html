
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join | Homework Club Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <a href="/" class="nav-brand">📚 Homework Club Hub</a>
            <div class="nav-links">
                <a href="/login">Already have an account? Login</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2 style="text-align: center; margin-top: 0;">Join the Community</h2>
            <form id="joinForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="full_name" required placeholder="Jane Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="jane@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label>I am a...</label>
                    <select id="role" onchange="toggleFields()">
                        <option value="student_parent">Student / Parent</option>
                        <option value="volunteer">Volunteer Tutor</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Subject of Interest / Expertise</label>
                    <input type="text" id="subject" placeholder="e.g. Biology, Calculus, Physics">
                </div>
                <div class="form-group">
                    <label>Language / Cultural Background</label>
                    <input type="text" id="language" placeholder="e.g. Spanish, Mandarin, Vietnamese">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
            </form>
            <div id="message" style="margin-top: 1rem; text-align: center; font-weight: 500;"></div>
        </div>
    </div>

    <script>
        document.getElementById('joinForm').onsubmit = async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            const data = {
                full_name: document.getElementById('full_name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value,
                subject: document.getElementById('subject').value,
                language: document.getElementById('language').value
            };

            try {
                const response = await fetch('/api/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (response.ok) {
                    msgDiv.style.color = 'green';
                    msgDiv.innerText = result.message + ' Redirecting...';
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    msgDiv.style.color = 'red';
                    msgDiv.innerText = result.error;
                }
            } catch (err) {
                msgDiv.innerText = 'An error occurred. Please try again.';
            }
        };
    </script>
</body>
</html>
