
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Homework Club Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <a href="/" class="nav-brand">📚 Homework Club Hub</a>
            <div class="nav-links">
                <a href="/join">Need an account? Join here</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2 style="text-align: center; margin-top: 0;">Welcome Back</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="jane@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
            <div id="message" style="margin-top: 1rem; text-align: center; font-weight: 500;"></div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (response.ok) {
                    msgDiv.style.color = 'green';
                    msgDiv.innerText = result.message + ' Redirecting...';
                    setTimeout(() => window.location.href = '/search', 2000);
                } else {
                    msgDiv.style.color = 'red';
                    msgDiv.innerText = result.error;
                }
            } catch (err) {
                msgDiv.innerText = 'An error occurred. Please try again.';
            }
        };
    </script>
</body>
</html>
