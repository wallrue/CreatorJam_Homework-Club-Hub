<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sessions | Homework Club Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4 { font-family: 'Lexend', sans-serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen">

    <!-- Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold text-emerald-700 flex items-center gap-2">
                        <i class="fas fa-graduation-cap"></i>
                        <span>Homework Club Hub</span>
                    </a>
                </div>
                <div class="hidden md:flex items-center gap-6" id="nav-links">
                    <!-- Links injected by updateNav() -->
                </div>
                <!-- Mobile Menu Button -->
                <div class="md:hidden">
                    <button id="mobile-menu-btn" class="text-stone-600 focus:outline-none">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-stone-100 px-4 py-4 space-y-3">
            <a href="/" class="block text-stone-600 hover:text-emerald-700 font-medium">Home</a>
            <a href="/search" class="block text-stone-600 hover:text-emerald-700 font-medium">Find a Tutor</a>
            <a href="/logout" class="block text-red-600 hover:text-red-800 font-medium">Logout</a>
        </div>
    </nav>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-20 right-4 z-50 space-y-2"></div>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto py-12 px-4">
        <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-stone-900 mb-1">My Sessions</h1>
                <p class="text-stone-600">View and manage your tutoring sessions.</p>
            </div>
            <a href="/search" class="bg-emerald-700 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-emerald-800 transition flex items-center gap-2 shrink-0">
                <i class="fas fa-plus"></i> Find a Tutor
            </a>
        </div>

        <!-- Sessions List -->
        <div id="sessions-list" class="space-y-4">
            <div class="text-center py-12 text-stone-400">
                <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                <p>Loading sessions...</p>
            </div>
        </div>
    </main>

    <!-- Rating Modal -->
    <div id="rating-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
            <h3 class="text-xl font-bold mb-4">Rate This Session</h3>
            <p class="text-stone-600 text-sm mb-4">How was your experience with this tutor?</p>
            <form id="ratingForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-stone-700 mb-2">Rating</label>
                    <div class="flex gap-2" id="star-rating">
                        <button type="button" class="text-3xl text-stone-300 hover:text-amber-400 focus:text-amber-400" data-star="1">&#9733;</button>
                        <button type="button" class="text-3xl text-stone-300 hover:text-amber-400 focus:text-amber-400" data-star="2">&#9733;</button>
                        <button type="button" class="text-3xl text-stone-300 hover:text-amber-400 focus:text-amber-400" data-star="3">&#9733;</button>
                        <button type="button" class="text-3xl text-stone-300 hover:text-amber-400 focus:text-amber-400" data-star="4">&#9733;</button>
                        <button type="button" class="text-3xl text-stone-300 hover:text-amber-400 focus:text-amber-400" data-star="5">&#9733;</button>
                    </div>
                    <input type="hidden" id="rating-value" value="0">
                </div>
                <div>
                    <label class="block text-sm font-medium text-stone-700 mb-1">Feedback / Thank You Note</label>
                    <textarea id="rating-feedback" rows="3"
                        class="block w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 text-sm"
                        placeholder="Share your experience or say thank you..."></textarea>
                </div>
                <div class="flex gap-3">
                    <button type="submit" class="px-5 py-2.5 bg-emerald-700 text-white rounded-lg font-medium hover:bg-emerald-800 transition">Submit Rating</button>
                    <button type="button" id="close-rating-btn" class="px-5 py-2.5 bg-stone-200 text-stone-700 rounded-lg font-medium hover:bg-stone-300 transition">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-stone-200 py-12 px-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="flex items-center gap-2 text-xl font-bold text-emerald-700">
                <i class="fas fa-graduation-cap"></i>
                <span>Homework Club Hub</span>
            </div>
            <p class="text-stone-500 text-sm">&copy; 2026 Homework Club Hub. Powered by Indigenomics.</p>
        </div>
    </footer>

    <script>
        // Mobile menu toggle
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });

        // Toast notification helper
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-6 py-3 rounded-lg shadow-lg text-white font-medium ${type === 'success' ? 'bg-emerald-700' : 'bg-red-600'}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Auth guard
        async function checkAuth() {
            try {
                const response = await fetch('/api/me');
                if (!response.ok) {
                    window.location.href = '/login';
                    return false;
                }
                return true;
            } catch (err) {
                window.location.href = '/login';
                return false;
            }
        }

        // Role-based navigation
        async function updateNav() {
            const navLinks = document.getElementById('nav-links');
            if (!navLinks) return;
            try {
                const response = await fetch('/api/me');
                if (response.ok) {
                    const user = await response.json();
                    let links = '';
                    links += '<a href="/" class="text-stone-600 hover:text-emerald-700 font-medium transition">Home</a>';
                    links += '<a href="/search" class="text-stone-600 hover:text-emerald-700 font-medium transition">Find a Tutor</a>';
                    links += '<a href="/my-profile" class="text-stone-600 hover:text-emerald-700 font-medium transition">My Profile</a>';
                    if (user.role === 'admin') {
                        links += '<a href="/admin" class="text-stone-600 hover:text-emerald-700 font-medium transition">Admin</a>';
                    }
                    links += '<a href="/logout" class="text-red-600 hover:text-red-800 font-medium transition"><i class="fas fa-sign-out-alt"></i> Logout</a>';
                    navLinks.innerHTML = links;
                }
            } catch (err) { /* stays as guest links */ }
        }

        // Rating star selection
        let currentRatingId = null;
        let selectedRating = 0;

        document.querySelectorAll('#star-rating button').forEach(btn => {
            btn.addEventListener('click', () => {
                selectedRating = parseInt(btn.dataset.star);
                document.getElementById('rating-value').value = selectedRating;
                document.querySelectorAll('#star-rating button').forEach(b => {
                    b.classList.toggle('text-amber-400', parseInt(b.dataset.star) <= selectedRating);
                    b.classList.toggle('text-stone-300', parseInt(b.dataset.star) > selectedRating);
                });
            });
        });

        document.getElementById('close-rating-btn').addEventListener('click', () => {
            document.getElementById('rating-modal').classList.add('hidden');
        });

        // Submit rating
        document.getElementById('ratingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const rating = parseInt(document.getElementById('rating-value').value);
            const feedback = document.getElementById('rating-feedback').value;

            if (rating === 0) {
                showToast('Please select a rating', 'error');
                return;
            }

            try {
                const response = await fetch(`/api/sessions/${currentRatingId}/rate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rating, feedback })
                });

                if (response.ok) {
                    showToast('Rating submitted! Thank you!', 'success');
                    document.getElementById('rating-modal').classList.add('hidden');
                    loadSessions();
                } else {
                    const result = await response.json();
                    showToast(result.error || 'Failed to submit rating', 'error');
                }
            } catch (err) {
                showToast('Network error. Please try again.', 'error');
            }
        });

        // Load and render sessions
        async function loadSessions() {
            const container = document.getElementById('sessions-list');
            container.innerHTML = '<div class="text-center py-12 text-stone-400"><i class="fas fa-spinner fa-spin text-2xl mb-2"></i><p>Loading sessions...</p></div>';

            try {
                const response = await fetch('/api/sessions');
                const sessions = await response.json();

                if (sessions.error) {
                    container.innerHTML = `<div class="text-center py-12 text-stone-400"><i class="fas fa-info-circle text-3xl mb-2"></i><p>${sessions.error}</p></div>`;
                    return;
                }

                if (sessions.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-12 bg-white rounded-2xl border border-stone-200">
                            <i class="fas fa-calendar-times text-5xl text-stone-200 mb-4"></i>
                            <h3 class="text-xl font-bold text-stone-500 mb-2">No Sessions Yet</h3>
                            <p class="text-stone-400 mb-6">You haven't booked any tutoring sessions.</p>
                            <a href="/search" class="bg-emerald-700 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-emerald-800 transition inline-flex items-center gap-2">
                                <i class="fas fa-search"></i> Find a Tutor
                            </a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = sessions.map(s => {
                    const statusColor = s.status === 'completed' ? 'bg-emerald-100 text-emerald-800' :
                                       s.status === 'pending' ? 'bg-amber-100 text-amber-800' :
                                       s.status === 'cancelled' ? 'bg-red-100 text-red-800' : 'bg-stone-100 text-stone-800';

                    return `
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
                            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                                <div class="flex-1">
                                    <div class="flex flex-wrap items-center gap-3 mb-2">
                                        <h3 class="text-lg font-bold text-stone-800">Session with ${s.tutor_name}</h3>
                                        <span class="px-3 py-1 rounded-full text-xs font-bold uppercase ${statusColor}">${s.status}</span>
                                    </div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-stone-600">
                                        <p><i class="fas fa-user w-5"></i> Student: ${s.student_name}</p>
                                        <p><i class="fas fa-calendar w-5"></i> ${s.scheduled_time}</p>
                                        <p><i class="fas fa-book w-5"></i> Needs: ${s.needs || 'Not specified'}</p>
                                        <p><i class="fas fa-video w-5"></i> ${s.session_type || 'Online'}</p>
                                    </div>
                                    ${s.rating ? `<div class="mt-2 text-amber-500"><i class="fas fa-star"></i> ${'★'.repeat(s.rating)}${'☆'.repeat(5 - s.rating)} ${s.feedback ? ' - ' + s.feedback : ''}</div>` : ''}
                                </div>
                                <div class="flex gap-2 shrink-0">
                                    ${!s.rating ? `<button onclick="openRating(${s.session_id})" class="px-4 py-2 bg-amber-500 text-white rounded-lg text-sm font-medium hover:bg-amber-600 transition">Rate</button>` : ''}
                                    ${s.status === 'pending' ? `<button onclick="cancelSession(${s.session_id})" class="px-4 py-2 bg-red-500 text-white rounded-lg text-sm font-medium hover:bg-red-600 transition">Cancel</button>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                container.innerHTML = '<div class="text-center py-12 text-red-500"><i class="fas fa-exclamation-triangle text-3xl mb-2"></i><p>Error loading sessions.</p></div>';
            }
        }

        // Open rating modal
        window.openRating = function(sessionId) {
            currentRatingId = sessionId;
            selectedRating = 0;
            document.getElementById('rating-value').value = '0';
            document.getElementById('rating-feedback').value = '';
            document.querySelectorAll('#star-rating button').forEach(b => {
                b.classList.remove('text-amber-400');
                b.classList.add('text-stone-300');
            });
            document.getElementById('rating-modal').classList.remove('hidden');
        };

        // Cancel session
        window.cancelSession = async function(sessionId) {
            if (!confirm('Are you sure you want to cancel this session?')) return;

            try {
                const response = await fetch(`/api/sessions/${sessionId}/cancel`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    showToast('Session cancelled', 'success');
                    loadSessions();
                } else {
                    const result = await response.json();
                    showToast(result.error || 'Failed to cancel', 'error');
                }
            } catch (err) {
                showToast('Network error. Please try again.', 'error');
            }
        };

        // Init
        checkAuth().then(ok => {
            if (ok) {
                loadSessions();
                updateNav();
            }
        });
    </script>
</body>
</html>
