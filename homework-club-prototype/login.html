<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Homework Club Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1 { font-family: 'Lexend', sans-serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border border-stone-200">
        <div class="text-center mb-8">
            <a href="/" class="inline-block mb-4">
                <span class="text-4xl">📚</span>
            </a>
            <h1 class="text-3xl font-bold text-emerald-800 mb-2">Welcome Back</h1>
            <p class="text-stone-600">Please enter your details to continue.</p>
        </div>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-stone-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition" placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-stone-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition" placeholder="Enter your password">
            </div>
            <button type="submit" class="w-full bg-emerald-700 text-white py-3 rounded-xl font-bold hover:bg-emerald-800 transition shadow-lg mt-2">
                Login
            </button>
        </form>
        
        <div id="message" class="mt-4 text-center hidden p-4 rounded-xl"></div>
        
        <div class="text-center mt-6 pt-6 border-t border-stone-100">
            <p class="text-sm text-stone-500">
                Don't have an account? 
                <a href="/join" class="text-emerald-700 font-semibold hover:underline">Please register here</a>
            </p>
            <p class="text-sm text-stone-500 mt-2">
                <a href="/" class="text-stone-500 hover:text-emerald-700 transition">← Back to Home</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            };

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                msgDiv.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
                if (response.ok) {
                    msgDiv.textContent = "Login successful! Redirecting...";
                    msgDiv.classList.add('bg-green-100', 'text-green-700');
                    msgDiv.classList.remove('hidden');
                    setTimeout(() => window.location.href = '/profile', 1500);
                } else {
                    msgDiv.textContent = result.error || 'Invalid credentials';
                    msgDiv.classList.add('bg-red-100', 'text-red-700');
                    msgDiv.classList.remove('hidden');
                }
            } catch (err) {
                msgDiv.textContent = 'Server connection failed';
                msgDiv.classList.add('bg-red-100', 'text-red-700');
                msgDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
